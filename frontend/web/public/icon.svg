<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle wetland waves / ripples -->
  <path d="M 64 340 Q 160 300 256 340 T 448 340 L 448 420 Q 352 450 256 420 T 64 420 Z" fill="url(#water)" opacity="0.35"/>
  <path d="M 64 380 Q 160 350 256 380 T 448 380 L 448 448 Q 352 460 256 448 T 64 448 Z" fill="url(#water)" opacity="0.5"/>

  <!-- Reed / Totora stalks on left side -->
  <path d="M 120 400 Q 110 260 140 160 Q 145 150 150 162 Q 130 260 135 400 Z" fill="#34d399"/>
  <path d="M 145 400 Q 155 240 185 180 Q 190 170 195 182 Q 170 250 160 400 Z" fill="#6ee7b7" opacity="0.8"/>
  <path d="M 95 400 Q 80 290 110 220 Q 115 210 120 222 Q 95 290 110 400 Z" fill="#10b981" opacity="0.7"/>

  <!-- Black-necked Swan emblem (Cisne de Cuello Negro - Cygnus melancoryphus) -->
  <!-- White body -->
  <path d="M 230 360 C 200 360 190 320 230 290 C 270 260 360 270 390 310 C 400 325 390 360 340 360 C 300 360 270 360 230 360 Z" fill="#f8fafc"/>
  <!-- Wing feathers accent -->
  <path d="M 260 330 C 290 310 340 315 365 335 C 330 345 290 345 260 330 Z" fill="#e2e8f0"/>
  
  <!-- Black neck and head -->
  <path d="M 240 320 C 210 300 200 240 235 190 C 255 160 280 150 290 175 C 295 190 285 205 270 215 C 240 235 235 285 255 315 Z" fill="#0f172a"/>
  <circle cx="280" cy="175" r="18" fill="#0f172a"/>
  
  <!-- Red caruncle & beak -->
  <circle cx="295" cy="177" r="7" fill="#ef4444"/>
  <polygon points="300,175 325,182 300,187" fill="#64748b"/>
  
  <!-- Eye -->
  <circle cx="276" cy="172" r="3" fill="#ffffff"/>
  
  <!-- Green plant sprout accent -->
  <circle cx="380" cy="140" r="12" fill="#10b981" opacity="0.6"/>
  <path d="M 370 150 Q 380 120 400 130 Q 385 145 370 150 Z" fill="#34d399"/>
</svg>
