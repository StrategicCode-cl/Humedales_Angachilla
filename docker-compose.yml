services:
  web:
    build:
      context: ./frontend/web
      args:
        # URL que usa el navegador para llegar a la API
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: humedales-web
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: humedales-backend
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MONGODB_URI: mongodb://mongo:27017/humedales
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      UTILIDAD_DIR: /app/utilidad
      POINTS_ROUTE_DIR: /app/Points_Route
      ESPECIES_EXTRA_DIR: /app/especies_extra
    volumes:
      - ./backend/src:/app/src:ro
      - ./utilidad:/app/utilidad:ro
      - ./backend/Points_Route:/app/Points_Route:ro
      - ./frontend/web/public/especies:/app/especies_extra:ro
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  db:
    # PostGIS para la geometría de los senderos y estaciones
    image: postgis/postgis:16-3.4
    container_name: humedales-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    # MongoDB 7 para el feed comunitario, posts, pines, likes (1 por usuario), comentarios y moderación
    image: mongo:7
    container_name: humedales-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
